# Entorno completo: servicios de soporte, Api y Worker (letra, sección 8.3: "docker compose up levanta el entorno completo").
# Para depurar la Api o el Worker desde Visual Studio, levantar sólo los servicios de soporte:
#   docker compose up -d --wait postgres valkey rabbitmq aspire-dashboard mailpit
name: logistica

# Variables comunes de la Api y el Worker.
x-app-environment: &app-environment
  ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
  ConnectionStrings__Valkey: valkey:6379
  ConnectionStrings__RabbitMQ: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
  ConnectionStrings__Smtp: smtp://mailpit:1025

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8.1
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    environment:
      # Solo para desarrollo local: el panel queda sin login.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "${ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "${OTLP_GRPC_PORT:-4317}:18889"
      - "${OTLP_HTTP_PORT:-4318}:18890"

  mailpit:
    # Captura los correos de desarrollo; no envía nada a direcciones reales.
    image: axllent/mailpit:v1.28
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    build:
      context: .
      dockerfile: src/Logistica.Api/Dockerfile
    environment:
      <<: *app-environment
      # Sólo la Api aplica las migraciones al iniciar; el Worker no toca el esquema.
      Database__MigrateOnStartup: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on: &app-depends-on
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/Logistica.Worker/Dockerfile
    environment: *app-environment
    depends_on: *app-depends-on

volumes:
  postgres-data:
  rabbitmq-data:
