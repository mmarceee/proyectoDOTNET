name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Logistica.slnx

      - name: Build
        run: dotnet build Logistica.slnx --no-restore --configuration Release

      - name: Release build servers
        run: dotnet build-server shutdown

      # Cobertura de las capas de dominio y aplicación (opcional 7.2): ver coverage.runsettings.
      - name: Test
        id: test
        timeout-minutes: 20
        run: |
          ejecutar_pruebas() {
            local proyecto="$1" grupo="$2"
            shift 2
            dotnet test "$proyecto" --no-build --configuration Release \
              --settings coverage.runsettings --collect "XPlat Code Coverage" \
              --logger trx \
              --blame-hang --blame-hang-timeout 3m --blame-hang-dump-type none \
              --results-directory "TestResults/$grupo" "$@"
          }

          # Cada grupo de integración arranca un testhost nuevo para liberar la memoria acumulada entre grupos.
          integracion=tests/Logistica.IntegrationTests
          envios_identidad='FullyQualifiedName~Logistica.IntegrationTests.Envios.|FullyQualifiedName~Logistica.IntegrationTests.Identidad.|FullyQualifiedName~Logistica.IntegrationTests.Tenancy.'
          seguimiento_resiliencia='FullyQualifiedName~Logistica.IntegrationTests.Seguimiento.|FullyQualifiedName~Logistica.IntegrationTests.Resiliencia.|FullyQualifiedName~Logistica.IntegrationTests.BuildingBlocks.|FullyQualifiedName~Logistica.IntegrationTests.Deposito.'
          resto="${envios_identidad//~/!~}&${seguimiento_resiliencia//~/!~}"
          resto="${resto//|/\&}"

          resultado=0
          ejecutar_pruebas tests/Logistica.UnitTests unitarias || resultado=1
          ejecutar_pruebas tests/Logistica.ArchitectureTests arquitectura || resultado=1
          ejecutar_pruebas "$integracion" envios-identidad --filter "$envios_identidad" || resultado=1
          ejecutar_pruebas "$integracion" seguimiento-resiliencia --filter "$seguimiento_resiliencia" || resultado=1
          ejecutar_pruebas "$integracion" otras-integraciones --filter "$resto" || resultado=1
          exit "$resultado"

      # TRX y secuencia de ejecución aunque falle una prueba o se detecte un bloqueo.
      - name: Upload test results
        if: ${{ always() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults
          if-no-files-found: warn

      # Une la cobertura de todos los grupos en un solo reporte.
      - name: Coverage report
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage \
            -reporttypes:"Html;MarkdownSummaryGithub" -title:"Logística · dominio y aplicación"

      # El resumen queda en la página de la ejecución; el reporte navegable, como artefacto.
      - name: Publish coverage summary
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage

  e2e:
    # Pruebas de extremo a extremo (opcional 7.2): Chromium recorre los flujos críticos sobre la aplicación completa
    # (tests/Logistica.E2ETests). Van en un job aparte porque necesitan el navegador instalado.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build tests/Logistica.E2ETests --configuration Release

      - name: Release build servers
        run: dotnet build-server shutdown

      # El script lo genera Playwright al compilar. Sin --with-deps: la imagen del runner ya trae las bibliotecas que
      # necesita Chromium, y --with-deps sólo agregaba fuentes opcionales por apt, que falló el 11/11/2026 porque el
      # runner no resolvía los servidores de Ubuntu. Así el paso no depende de apt. scripts/e2e-en-docker.sh sí lo usa:
      # su contenedor del SDK no trae esas bibliotecas.
      - name: Install Chromium
        run: pwsh tests/Logistica.E2ETests/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Test
        id: test
        timeout-minutes: 15
        env:
          E2E_RESULTADOS: ${{ github.workspace }}/TestResults/e2e
        run: >
          dotnet test tests/Logistica.E2ETests --no-build --configuration Release
          --logger trx --logger "console;verbosity=normal"
          --results-directory TestResults/e2e

      # Resultados y la traza de cada ventana del navegador (se abre en https://trace.playwright.dev).
      - name: Upload E2E results
        if: ${{ always() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-e2e
          path: TestResults/e2e
          retention-days: 7
          if-no-files-found: warn

  docker-images:
    # Verifica que las imágenes de la API y el Worker sigan compilando. En un push a main, además las publica en GitHub
    # Container Registry con la etiqueta del commit; el job deploy las promueve a latest si pasan las pruebas.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR exige el nombre de la imagen en minúsculas.
      - name: Image names
        run: |
          echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Api image
        run: docker build -f src/Logistica.Api/Dockerfile -t "$IMAGEN/api:${{ github.sha }}" .

      - name: Build Worker image
        run: docker build -f src/Logistica.Worker/Dockerfile -t "$IMAGEN/worker:${{ github.sha }}" .

      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGEN/api:${{ github.sha }}"
          docker push "$IMAGEN/worker:${{ github.sha }}"

  deploy:
    # Despliegue continuo (letra, sección 6.14): cada push a main que pasa las pruebas promueve sus imágenes a latest y
    # actualiza las Container Apps de Azure (infra/terraform). Sin el secreto AZURE_CREDENTIALS, o con el ambiente
    # destruido, sólo promueve las imágenes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, e2e, docker-images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      GRUPO: logistica-produccion

    steps:
      - name: Image names
        run: |
          echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # latest es la imagen con la que Terraform crea las Container Apps la primera vez.
      - name: Promote images to latest
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for imagen in api worker; do
            docker buildx imagetools create -t "$IMAGEN/$imagen:latest" "$IMAGEN/$imagen:${{ github.sha }}"
          done

      - name: Check credentials
        if: ${{ env.AZURE_CREDENTIALS == '' }}
        run: echo "::notice::Falta el secreto AZURE_CREDENTIALS; no se actualiza Azure."

      # La entidad de servicio sólo tiene permiso sobre el grupo de recursos (lo asigna Terraform). Con el ambiente
      # destruido, el grupo y el permiso ya no existen y el inicio de sesión falla: el job sigue, sin desplegar.
      - uses: azure/login@v2
        id: azure-login
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        continue-on-error: true
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Check Azure login
        if: ${{ steps.azure-login.outcome == 'failure' }}
        run: echo "::warning::No se pudo iniciar sesión en Azure. Si el ambiente $GRUPO está destruido es lo esperado; si existe, revisar AZURE_CREDENTIALS y la variable ci_principal_id de Terraform."

      # La API primero: aplica las migraciones al iniciar. Si el ambiente no existe, no hace nada.
      - name: Deploy to Container Apps
        if: ${{ steps.azure-login.outcome == 'success' }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          if ! az containerapp show -g "$GRUPO" -n "$GRUPO-api" --query name -o tsv > /dev/null 2>&1; then
            echo "::notice::No existe el ambiente $GRUPO; no se despliega."
            exit 0
          fi
          az containerapp update -g "$GRUPO" -n "$GRUPO-api" --image "$IMAGEN/api:${{ github.sha }}" --output none
          az containerapp update -g "$GRUPO" -n "$GRUPO-worker" --image "$IMAGEN/worker:${{ github.sha }}" --output none
