name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Logistica.slnx

      - name: Build
        run: dotnet build Logistica.slnx --no-restore --configuration Release

      - name: Release build servers
        run: dotnet build-server shutdown

      # Cobertura de las capas de dominio y aplicación (opcional 7.2): ver coverage.runsettings.
      - name: Test
        id: test
        timeout-minutes: 20
        run: >
          dotnet test Logistica.slnx --no-build --configuration Release
          --settings coverage.runsettings --collect "XPlat Code Coverage"
          --logger trx
          --blame-hang --blame-hang-timeout 3m --blame-hang-dump-type none
          --results-directory TestResults

      # TRX y secuencia de ejecución aunque falle una prueba o se detecte un bloqueo.
      - name: Upload test results
        if: ${{ always() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults
          if-no-files-found: warn

      # Une los resultados de los tres proyectos de prueba en un solo reporte.
      - name: Coverage report
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage \
            -reporttypes:"Html;MarkdownSummaryGithub" -title:"Logística · dominio y aplicación"

      # El resumen queda en la página de la ejecución; el reporte navegable, como artefacto.
      - name: Publish coverage summary
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage

  docker-images:
    # Verifica que las imágenes que despliega App Platform sigan compilando.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Api image
        run: docker build -f src/Logistica.Api/Dockerfile .

      - name: Build Worker image
        run: docker build -f src/Logistica.Worker/Dockerfile .

  deploy:
    # Despliegue continuo (letra, sección 6.14): cada push a main que pasa las pruebas y compila las imágenes se
    # despliega en App Platform, que compila la API y el Worker desde la rama. Si el ambiente está destruido, no hace nada.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, docker-images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    steps:
      # Sin el secreto (repositorio sin configurar o un fork), el job termina sin desplegar.
      - name: Check token
        if: ${{ env.DIGITALOCEAN_ACCESS_TOKEN == '' }}
        run: echo "::notice::Falta el secreto DIGITALOCEAN_ACCESS_TOKEN; no se despliega."

      - uses: digitalocean/action-doctl@v2
        if: ${{ env.DIGITALOCEAN_ACCESS_TOKEN != '' }}
        with:
          token: ${{ env.DIGITALOCEAN_ACCESS_TOKEN }}

      # La aplicación se busca por su nombre (infra/terraform): el identificador cambia al reconstruir el ambiente.
      - name: Deploy to App Platform
        if: ${{ env.DIGITALOCEAN_ACCESS_TOKEN != '' }}
        run: |
          app_id=$(doctl apps list --format ID,Spec.Name --no-header | awk '$2 == "logistica-produccion" { print $1 }')
          if [ -z "$app_id" ]; then
            echo "::notice::No existe la aplicación logistica-produccion; no se despliega."
            exit 0
          fi
          doctl apps create-deployment "$app_id" --wait
