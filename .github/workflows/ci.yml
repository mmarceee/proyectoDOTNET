name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Logistica.slnx

      - name: Build
        run: dotnet build Logistica.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Logistica.slnx --no-build --configuration Release

  docker-images:
    # Verifica que las imágenes que despliega App Platform sigan compilando.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Api image
        run: docker build -f src/Logistica.Api/Dockerfile .

      - name: Build Worker image
        run: docker build -f src/Logistica.Worker/Dockerfile .
